[project]
name = "hexapod-cad"
version = "0.1.0"
description = "CAD-driven generation of the hexapod's realistic URDF (build123d)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "build123d>=0.9",
    "numpy>=1.26",
    "yourdfpy>=0.0.60",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hexapod_cad"]

# Deliberately NOT resolved against the Isaac venv. build123d pulls cadquery-ocp
# (a ~400 MB OCCT build) and its own numpy floor; installing that into
# env_isaaclab or the repo .venv risks shadowing the pinned Isaac stack.
# See CLAUDE.md -> Environment.
